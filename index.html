<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="番數王">
<meta name="format-detection" content="telephone=no">
<title>番數王</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
<style>
.chip:disabled{opacity:.28;cursor:default}
.chip.auto:disabled{opacity:1;background:var(--green);color:#fff}
.chip.auto b{color:#d6f0e1}
.chip i{font-style:normal;font-size:10px;margin-left:5px;padding:1px 5px;border-radius:6px;background:rgba(255,255,255,.22)}
.fanbox button:disabled{opacity:.3}
.adjnote{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.fanbox .v{display:flex;align-items:baseline;justify-content:center}
.fanin{width:2.6ch;min-width:64px;border:0;border-bottom:2px dashed var(--line);background:transparent;color:var(--ink);
  font:700 46px var(--num);text-align:center;padding:0;outline:none;border-radius:0;-webkit-user-select:text;user-select:text}
.fanin:focus{border-bottom-color:var(--gold)}
.glbl{font-size:11px;color:var(--muted);margin:12px 0 6px;letter-spacing:.08em}
.glbl:first-of-type{margin-top:2px}
.toolbar{grid-template-columns:repeat(6,minmax(0,1fr))!important;padding-left:6px!important;padding-right:6px!important}
.tool{font-size:10.5px!important;white-space:nowrap}
.tool .ic{width:42px!important;height:42px!important}
@media (max-width:370px){.tool .ic{width:38px!important;height:38px!important}.tool{font-size:9.5px!important}}
</style>
</head>
<body>
<div class="phone" id="phone"></div>
<script src="scoring.js"></script>
<script src="app.js"></script>
<script src="sheets.js"></script>
<script src="pwa.js"></script>
</body>
</html>
